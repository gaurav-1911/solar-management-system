<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="panelFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Sun Rays (Top Left) -->
  <g stroke="url(#sunGrad)" stroke-width="4.5" stroke-linecap="round">
    <line x1="30" y1="10" x2="30" y2="17" />
    <line x1="10" y1="30" x2="17" y2="30" />
    <line x1="16" y1="16" x2="21" y2="21" />
    <line x1="44" y1="16" x2="39" y2="21" />
    <line x1="16" y1="44" x2="21" y2="39" />
  </g>

  <!-- Radiant Sun Core -->
  <circle cx="30" cy="30" r="14" fill="url(#sunGrad)" />
  <circle cx="30" cy="30" r="9" fill="#fef08a" />

  <!-- 3D Solar Plate / Panel Frame -->
  <path d="M 20 42 L 80 42 L 90 86 L 10 86 Z" fill="url(#panelFrameGrad)" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Solar Plate Blue Cells -->
  <path d="M 22 44 L 78 44 L 87 84 L 13 84 Z" fill="url(#cellGrad)" />

  <!-- Solar Plate Grid Lines -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <!-- Horizontal Dividers -->
    <line x1="18" y1="57" x2="82" y2="57" />
    <line x1="15" y1="70" x2="85" y2="70" />
    <!-- Vertical Dividers -->
    <line x1="38" y1="44" x2="31" y2="84" />
    <line x1="50" y1="44" x2="50" y2="84" />
    <line x1="62" y1="44" x2="69" y2="84" />
  </g>
</svg>
